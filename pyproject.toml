[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filesearch"
version = "0.1.1"
description = "Локальный семантический поиск по документам"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pypdfium2>=4.30,<5",
  "Pillow>=13.0.0,<14",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/Mafsolin/FileSearch"
Repository = "https://github.com/Mafsolin/FileSearch.git"
Issues = "https://github.com/Mafsolin/FileSearch/issues"

[project.scripts]
filesearch = "filesearch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
